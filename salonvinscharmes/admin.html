<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin · Club Œnologie Découvertes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://upload-widget.cloudinary.com/global/all.js" async></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1B1440;--grape:#7A4BB0;--amber:#E2903F;--bordeaux:#7A1F3D;
    --paper:#F7F2E7;--paper-2:#EFE6D3;--ink-soft:#4b4270;--line:rgba(27,20,64,.14);
    --ok:#3f7d4f;--danger:#9c4a3c;
  }
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;padding-bottom:96px}

  /* ── Topbar ── */
  header{position:sticky;top:0;z-index:30;background:var(--ink);
    padding:14px 18px;display:flex;align-items:center;gap:12px;
    border-bottom:1px solid rgba(226,144,63,.3)}
  .logo-dot{width:34px;height:34px;border-radius:50%;background:var(--amber);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:.8rem}
  header h1{font-family:'Fraunces',serif;font-size:1.02rem;color:var(--paper);font-weight:700;line-height:1.1}
  header p{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}

  main{max-width:680px;margin:0 auto;padding:16px}

  .intro{background:#fff;border:1px solid var(--line);border-left:3px solid var(--grape);
    padding:14px 16px;margin-bottom:16px;font-size:.85rem;color:var(--ink-soft)}
  .intro strong{color:var(--ink)}

  /* ── Accordéon sections ── */
  .section{background:#fff;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
  .section > summary{list-style:none;cursor:pointer;padding:16px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-family:'Fraunces',serif;font-size:1.02rem;font-weight:700;color:var(--ink);
    -webkit-tap-highlight-color:transparent}
  .section > summary::-webkit-details-marker{display:none}
  .section > summary .chev{transition:transform .25s;color:var(--grape);font-size:1.1rem;flex-shrink:0}
  .section[open] > summary .chev{transform:rotate(90deg)}
  .section > summary:hover{background:#faf7f1}
  .section-body{padding:4px 18px 20px}

  /* ── Champs ── */
  .field{margin-bottom:16px}
  label.lbl{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin-bottom:6px}
  input[type=text],input[type=email],input[type=tel],textarea,select{
    width:100%;padding:12px 14px;border:1px solid var(--line);background:#fff;
    font-family:'Inter',sans-serif;font-size:1rem;color:var(--ink);outline:none;
    transition:border-color .2s;border-radius:8px}
  input:focus,textarea:focus,select:focus{border-color:var(--grape)}
  textarea{resize:vertical;min-height:84px;line-height:1.55}
  .hint{font-size:.72rem;color:var(--ink-soft);opacity:.8;margin-top:5px}

  /* ── Boutons ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;border:none;cursor:pointer;font-family:'Inter',sans-serif;
    font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    transition:background .2s,opacity .2s;border-radius:100px}
  .btn-accent{background:var(--ink);color:var(--paper)}
  .btn-accent:hover{background:var(--grape)}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--grape);color:var(--grape)}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(156,74,60,.4)}
  .btn-danger:hover{background:rgba(156,74,60,.08)}
  .btn-sm{padding:8px 12px;font-size:.68rem}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  /* ── Cartes répétables (items) ── */
  .repeat{border:1px solid var(--line);background:#faf7f1;padding:14px;margin-bottom:12px;position:relative;border-radius:10px}
  .repeat .rowtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .repeat .rowtop .tag{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--grape);font-weight:700}
  .repeat .reorder{display:flex;gap:6px}
  .miniadd{margin-top:4px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  /* ── Barre d'enregistrement ── */
  .savebar{position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(27,20,64,.96);backdrop-filter:blur(10px);
    border-top:1px solid rgba(226,144,63,.3);
    padding:12px 16px;display:flex;align-items:center;gap:12px}
  .savebar .status{flex:1;min-width:0;font-size:.74rem;color:var(--paper)}
  .savebar .status.dirty{color:var(--amber)}
  .savebar .status.ok{color:#8fd09c}
  .savebar .status.err{color:#e3a499}
  .savebar .btn-accent{flex-shrink:0}

  @media(min-width:920px){
    main{max-width:1500px}
    .workspace{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
    .tabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;
      background:#fff;border:1px solid var(--line);padding:8px;border-radius:10px}
    .tabs button{display:block;width:100%;text-align:left;border:none;background:none;
      font-family:'Inter',sans-serif;font-size:.86rem;font-weight:600;color:var(--ink-soft);
      padding:11px 13px;cursor:pointer;border-left:3px solid transparent;border-radius:6px;
      transition:background .15s,color .15s,border-color .15s;line-height:1.3}
    .tabs button:hover{background:#faf7f1;color:var(--ink)}
    .tabs button.active{background:#faf7f1;color:var(--ink);border-left-color:var(--grape)}

    .section{display:none;margin-bottom:0;border:none;background:transparent}
    .section.is-active{display:block}
    .section > summary{display:none}
    .section-body{padding:0}

    .section-body > div:has(> .repeat){display:grid;grid-template-columns:1fr 1fr;
      gap:16px;align-items:start}
    .repeat{margin-bottom:0}
    .miniadd{margin-top:16px}
  }
  @media(max-width:919px){ .tabs{display:none} }
  
  /* ===== Éditeur FAQ ===== */
  .faqadm{ margin:14px 0; }

  .faqadm-cat{
    border:1px solid rgba(27,20,64,.14);
    border-radius:10px;
    margin-bottom:10px;
    background:#fff;
    overflow:hidden;
  }
  .faqadm-cat[open]{ border-color:rgba(122,75,176,.4); }
  .faqadm-cat > summary{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    cursor:pointer;
    list-style:none;
    background:rgba(122,75,176,.05);
  }
  .faqadm-cat > summary::-webkit-details-marker{ display:none; }
  .faqadm-cat > summary::marker{ content:''; }

  .faqadm-cat-title{
    flex:1;
    min-width:0;
    font-weight:600;
    font-size:.92rem;
    color:#1B1440;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .faqadm-cat-count{
    font-size:.75rem;
    color:rgba(27,20,64,.5);
    white-space:nowrap;
  }
  .faqadm-cat-body{ padding:14px; }

  .faqadm-q{
    border:1px solid rgba(27,20,64,.1);
    border-left:3px solid #E2903F;
    border-radius:8px;
    padding:12px 14px;
    margin:12px 0;
    background:rgba(247,242,231,.5);
  }
  .faqadm-q-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .faqadm-q-num{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#7A4BB0;
  }

  .faqadm-tools{ display:flex; gap:4px; flex:0 0 auto; }
  .faqadm-tool{
    width:26px; height:26px;
    display:grid; place-items:center;
    font-size:.8rem; line-height:1;
    color:#1B1440;
    background:#fff;
    border:1px solid rgba(27,20,64,.16);
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .faqadm-tool:hover{ background:#7A4BB0; color:#fff; border-color:#7A4BB0; }
  .faqadm-tool[title^="Supprimer"]:hover{ background:#7A1F3D; border-color:#7A1F3D; }

  .subhead{
    margin:26px 0 4px;
    padding-bottom:6px;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(27,20,64,.55);
    border-bottom:1px solid rgba(27,20,64,.1);
  }
</style>
</head>
<body>

<header>
  <div class="logo-dot">CŒD</div>
  <div>
    <h1>Administration du site</h1>
    <p>Club Œnologie Découvertes</p>
  </div>
</header>

<main>
  <div class="intro">
    Modifiez les <strong>textes</strong> du site, puis touchez <strong>Enregistrer</strong>
    en bas. Les changements sont publiés immédiatement sur les 4 pages.
  </div>

  <div class="workspace">
    <nav class="tabs" id="tabs"></nav>
    <div id="app"></div>
  </div>
</main>

<div class="savebar">
  <div class="status" id="status">Chargement…</div>
  <button class="btn btn-accent" id="saveBtn" disabled>Enregistrer</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ÉTAT
═══════════════════════════════════════════════════════════ */
let state = null;
let dirty = false;

const $app    = document.getElementById('app');
const $status = document.getElementById('status');
const $save   = document.getElementById('saveBtn');
const $tabs   = document.getElementById('tabs');

const mqDesktop = window.matchMedia('(min-width:920px)');
let activeTab = 0;

/* ── Helpers DOM ── */
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') n.className = attrs[k];
    else if(k==='html') n.innerHTML = attrs[k];
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!=null) n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c=>n.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return n;
}
function markDirty(){
  dirty = true;
  $save.disabled = false;
  $status.className = 'status dirty';
  $status.textContent = 'Modifications non enregistrées';
}

/* ── Champ texte lié à une valeur ── */
function textField(labelTxt, value, onChange, {multiline=false, hint='', placeholder=''}={}){
  const input = multiline
    ? el('textarea',{placeholder})
    : el('input',{type:'text',placeholder});
  input.value = value ?? '';
  input.addEventListener('input', ()=>{ onChange(input.value); markDirty(); });
  const f = el('div',{class:'field'}, el('label',{class:'lbl'},labelTxt), input);
  if(hint) f.appendChild(el('div',{class:'hint'},hint));
  return f;
}

/* ── Champ multivaleur (liste séparée par des virgules) lié à un tableau ── */
function tagsField(labelTxt, arr, onChange, {hint='Séparez plusieurs valeurs par une virgule.'}={}){
  const input = el('input',{type:'text'});
  input.value = (arr||[]).join(', ');
  input.addEventListener('input', ()=>{
    onChange(input.value.split(',').map(s=>s.trim()).filter(Boolean));
    markDirty();
  });
  const f = el('div',{class:'field'}, el('label',{class:'lbl'},labelTxt), input);
  if(hint) f.appendChild(el('div',{class:'hint'},hint));
  return f;
}

/* ── Champ photo (upload Cloudinary + URL manuelle) ── */
function photoField(labelTxt, value, onChange){
  const f = el('div',{class:'field'}, el('label',{class:'lbl'},labelTxt));

  const preview = el('div',{style:'margin-bottom:10px;'});
  function drawPreview(){
    preview.innerHTML = '';
    if(value){
      preview.appendChild(el('img',{src:value,alt:'',
        style:'max-width:140px;max-height:140px;border-radius:10px;border:1px solid var(--line);display:block;'}));
    }
  }
  drawPreview();
  f.appendChild(preview);

  const row = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;'});
  const uploadBtn = el('button',{class:'btn btn-ghost btn-sm',type:'button'},'📷 Uploader une photo');
  const clearBtn = el('button',{class:'btn btn-ghost btn-sm',type:'button',style:value?'':'display:none;'},'Supprimer la photo');
  row.appendChild(uploadBtn); row.appendChild(clearBtn);
  f.appendChild(row);

  uploadBtn.addEventListener('click', ()=>{
    const cfg = (state.settings && state.settings.cloudinary) || {};
    if(!cfg.cloudName || !cfg.uploadPreset){
      alert('Configurez d\u2019abord le Cloud name et l\u2019Upload preset Cloudinary dans la section « Réglages ».');
      return;
    }
    if(typeof cloudinary === 'undefined'){
      alert('Le module Cloudinary n\u2019a pas pu se charger (vérifiez la connexion internet).');
      return;
    }
    const widget = cloudinary.createUploadWidget(
      { cloudName: cfg.cloudName, uploadPreset: cfg.uploadPreset, multiple:false, sources:['local','camera','url'] },
      (error, result) => {
        if(!error && result && result.event === 'success'){
          value = result.info.secure_url;
          onChange(value);
          markDirty();
          drawPreview();
          clearBtn.style.display = '';
        }
      }
    );
    widget.open();
  });

  clearBtn.addEventListener('click', ()=>{
    value = '';
    onChange('');
    markDirty();
    drawPreview();
    clearBtn.style.display = 'none';
  });

  return f;
}

/* ── Sélecteur générique ── */
function selectField(labelTxt, value, options, onChange){
  const sel = el('select');
  options.forEach(([v,lab])=>{
    const o = el('option',{value:v}, lab);
    if(v===value) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{ onChange(sel.value); markDirty(); });
  return el('div',{class:'field'}, el('label',{class:'lbl'},labelTxt), sel);
}

/* ── Carte répétable générique ──
   fields: fonction qui reçoit l'item et retourne un tableau d'éléments de champ */
function repeatList(container, arr, tagLabel, buildFields, newItem){
  const list = el('div');
  function draw(){
    list.innerHTML='';
    arr.forEach((item,i)=>{
      const card = el('div',{class:'repeat'});
      card.appendChild(el('div',{class:'rowtop'},
        el('span',{class:'tag'}, tagLabel+' '+(i+1)),
        el('div',{class:'reorder'},
          el('button',{class:'btn btn-ghost btn-sm',type:'button',disabled:i===0||null,
            onclick:()=>{ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; markDirty(); draw(); } },'↑'),
          el('button',{class:'btn btn-ghost btn-sm',type:'button',disabled:i===arr.length-1||null,
            onclick:()=>{ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; markDirty(); draw(); } },'↓'),
          el('button',{class:'btn btn-danger btn-sm',type:'button',
            onclick:()=>{ if(confirm('Supprimer ?')){ arr.splice(i,1); markDirty(); draw(); } }},'Supprimer')
        )));
      buildFields(item, i).forEach(f=>card.appendChild(f));
      list.appendChild(card);
    });
  }
  draw();
  container.appendChild(list);
  container.appendChild(el('button',{class:'btn btn-ghost miniadd',type:'button',
    onclick:()=>{ arr.push(newItem()); markDirty(); draw(); }},'+ Ajouter'));
}
/* ═══════════════════════════════════════════════════════════
   ÉDITEUR FAQ (catégories → questions, 2 niveaux)
═══════════════════════════════════════════════════════════ */
function faqEditor(container){
  const p    = state.faqPage = state.faqPage || {};
  const cats = p.categories  = p.categories  || [];
  const list = el('div', {class:'faqadm'});

  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  const opened = new WeakSet();
  let pendingFocus = null;   // objet (question ou catégorie) à focaliser après redraw
  let focusCard   = null;    // carte DOM correspondante, remplie pendant draw()

  function move(arr, i, delta){
    const j = i + delta;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    markDirty(); draw();
  }

  function toolBtn(label, title, onclick){
    return el('button', {type:'button', class:'faqadm-tool', title, onclick}, label);
  }

  function draw(){
    list.innerHTML = '';

    if(!cats.length){
      list.appendChild(el('p', {class:'hint'},
        'Aucune catégorie pour l’instant. Cliquez sur « + Ajouter une catégorie ».'));
    }

    cats.forEach((cat, ci) => {
      cat.items = cat.items || [];

      const det = el('details', {class:'faqadm-cat'});
      det.open = opened.has(cat);
      det.addEventListener('toggle', () => {
        det.open ? opened.add(cat) : opened.delete(cat);
      });
      if (cat === pendingFocus) focusCard = det;

      det.appendChild(el('summary', {},
        el('span', {class:'faqadm-cat-title'},
          String(ci + 1).padStart(2,'0') + '. ' + (cat.nom || '(catégorie sans nom)')
        ),
        el('span', {class:'faqadm-cat-count'},
          cat.items.length + (cat.items.length > 1 ? ' questions' : ' question')
        ),
        el('span', {class:'faqadm-tools'},
          toolBtn('↑', 'Monter la catégorie', e => { stop(e); move(cats, ci, -1); }),
          toolBtn('↓', 'Descendre la catégorie', e => { stop(e); move(cats, ci, 1); }),
          toolBtn('✕', 'Supprimer la catégorie', e => {
            stop(e);
            if(confirm('Supprimer la catégorie « ' + (cat.nom || 'sans nom') +
                       ' » et ses ' + cat.items.length + ' question(s) ?')){
              cats.splice(ci, 1); markDirty(); draw();
            }
          })
        )
      ));

      const body = el('div', {class:'faqadm-cat-body'});

      body.appendChild(textField('Nom de la catégorie', cat.nom, v => { cat.nom = v; }));

      // ── Questions de la catégorie ──
      cat.items.forEach((item, qi) => {
        const card = el('div', {class:'faqadm-q'});
        if (item === pendingFocus) focusCard = card;

        card.appendChild(el('div', {class:'faqadm-q-head'},
          el('span', {class:'faqadm-q-num'}, 'Question ' + (qi + 1)),
          el('span', {class:'faqadm-tools'},
            toolBtn('↑', 'Monter', e => { stop(e); move(cat.items, qi, -1); }),
            toolBtn('↓', 'Descendre', e => { stop(e); move(cat.items, qi, 1); }),
            toolBtn('✕', 'Supprimer', e => {
              stop(e);
              if(confirm('Supprimer cette question ?')){
                cat.items.splice(qi, 1); markDirty(); draw();
              }
            })
          )
        ));

        card.appendChild(textField('Question', item.q, v => { item.q = v; },
          {multiline:true}));

        card.appendChild(textField('Réponse', item.r, v => { item.r = v; },
          {multiline:true, hint:'Mise en forme autorisée : <strong>gras</strong>, ' +
            '<em>italique</em>, <br> pour un saut de ligne, ' +
            '<ul><li>puce</li></ul> pour une liste, et ' +
            '<a href=\'page.php\'>texte du lien</a> pour un lien ' +
            '(guillemets simples uniquement).'}));

        body.appendChild(card);
      });

      body.appendChild(el('button', {
        class:'btn btn-ghost miniadd', type:'button',
        onclick: () => {
          const nouvelle = {q:'', r:''};
          cat.items.push(nouvelle);
          opened.add(cat);          // garde la catégorie dépliée
          pendingFocus = nouvelle;  // focus sur le champ « Question »
          markDirty(); draw();
        }
      }, '+ Ajouter une question'));

      det.appendChild(body);
      list.appendChild(det);
    });

    // Focus + défilement vers l'élément qui vient d'être créé
    if (focusCard) {
      const cible = focusCard;
      focusCard = null;
      pendingFocus = null;
      requestAnimationFrame(() => {
        const champ = cible.querySelector('textarea, input');
        if (champ) {
          champ.focus();
          champ.scrollIntoView({block:'center', behavior:'smooth'});
        }
      });
    }
  }

  draw();
  container.appendChild(list);
  container.appendChild(el('button', {
    class:'btn btn-ghost miniadd', type:'button',
    onclick: () => {
      const nouvelle = {nom:'Nouvelle catégorie', items:[]};
      cats.push(nouvelle);
      opened.add(nouvelle);
      pendingFocus = nouvelle;
      markDirty(); draw();
    }
  }, '+ Ajouter une catégorie'));
}
/* ═══════════════════════════════════════════════════════════
   ÉDITEUR GALERIE (albums → photos, 2 niveaux)
═══════════════════════════════════════════════════════════ */
function galerieEditor(container){
  const p      = state.galeriePage = state.galeriePage || {};
  const albums = p.albums = p.albums || [];
  const list   = el('div');
  const opened = new WeakSet();

  function move(arr, i, delta){
    const j = i + delta;
    if(j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    markDirty(); draw();
  }

  function tool(label, title, onclick, danger){
    return el('button', {type:'button', title,
      class:'btn btn-sm ' + (danger ? 'btn-danger' : 'btn-ghost'),
      onclick:(ev)=>{ ev.preventDefault(); ev.stopPropagation(); onclick(); }}, label);
  }

  /* Upload multiple : 20 photos d'un coup */
  function bulkUpload(album){
    const cfg = (state.settings && state.settings.cloudinary) || {};
    if(!cfg.cloudName || !cfg.uploadPreset){
      alert('Configurez d\u2019abord le Cloud name et l\u2019Upload preset Cloudinary dans la section « Réglages ».');
      return;
    }
    if(typeof cloudinary === 'undefined'){
      alert('Le module Cloudinary n\u2019a pas pu se charger (vérifiez la connexion internet).');
      return;
    }
    let added = 0;
    const widget = cloudinary.createUploadWidget(
      { cloudName: cfg.cloudName, uploadPreset: cfg.uploadPreset,
        multiple: true, maxFiles: 40, sources:['local','camera','url'] },
      (error, result)=>{
        if(error || !result) return;
        if(result.event === 'success'){
          album.photos = album.photos || [];
          album.photos.push({ src: result.info.secure_url, legende: '' });
          added++; markDirty();
        }
        if(result.event === 'queues-end' || result.event === 'close'){
          if(added){ added = 0; opened.add(album); draw(); }
        }
      });
    widget.open();
  }

  function photoCard(photos, ph, pi){
    const card = el('div',{style:'display:flex;gap:12px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;'});
    card.appendChild(el('img',{src: ph.src || '', alt:'',
      style:'width:86px;height:86px;object-fit:cover;border-radius:8px;flex:none;background:#f3efe6;'}));

    const right = el('div',{style:'flex:1;min-width:0;'});
    const input = el('input',{type:'text',placeholder:'Légende (facultative)'});
    input.value = ph.legende || '';
    input.addEventListener('input', ()=>{ ph.legende = input.value; markDirty(); });
    right.appendChild(input);
    right.appendChild(el('div',{style:'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;'},
      tool('↑','Monter',    ()=>move(photos, pi, -1)),
      tool('↓','Descendre', ()=>move(photos, pi, 1)),
      tool('Supprimer','Supprimer cette photo', ()=>{
        if(confirm('Supprimer cette photo ?')){ photos.splice(pi,1); markDirty(); draw(); }
      }, true)
    ));
    card.appendChild(right);
    return card;
  }

  function draw(){
    list.innerHTML = '';

    if(!albums.length){
      list.appendChild(el('p',{class:'hint'},
        'Aucun album pour l’instant. Cliquez sur « + Ajouter un album ».'));
    }

    albums.forEach((album, ai)=>{
      album.photos = album.photos || [];

      const det = el('details',{style:'border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#faf7f1;overflow:hidden;'});
      det.open = opened.has(album);
      det.addEventListener('toggle', ()=>{ det.open ? opened.add(album) : opened.delete(album); });

      det.appendChild(el('summary',{style:'display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:600;'},
        el('span',{style:'flex:1;min-width:0;'},
          String(ai+1).padStart(2,'0') + '. ' + (album.nom || '(album sans nom)')),
        el('span',{class:'hint',style:'margin:0;white-space:nowrap;'},
          album.photos.length + (album.photos.length > 1 ? ' photos' : ' photo')),
        el('span',{style:'display:flex;gap:6px;'},
          tool('↑','Monter l’album',    ()=>move(albums, ai, -1)),
          tool('↓','Descendre l’album', ()=>move(albums, ai, 1)),
          tool('Supprimer','Supprimer l’album', ()=>{
            if(confirm('Supprimer l’album « ' + (album.nom || 'sans nom') + ' » et ses ' + album.photos.length + ' photo(s) ?')){
              albums.splice(ai,1); markDirty(); draw();
            }
          }, true))
      ));

      const body = el('div',{style:'padding:0 14px 16px;'});
      body.appendChild(textField('Nom de l’album', album.nom, v=>{ album.nom = v; },
        {hint:'Sert de libellé au bouton de filtre sur la page (ex : Édition 2025).'}));
      body.appendChild(el('button',{type:'button',class:'btn btn-ghost btn-sm',
        style:'margin:2px 0 14px;', onclick:()=>bulkUpload(album)},
        '📷 Ajouter des photos (sélection multiple)'));

      album.photos.forEach((ph, pi)=> body.appendChild(photoCard(album.photos, ph, pi)));

      det.appendChild(body);
      list.appendChild(det);
    });
  }

  draw();
  container.appendChild(list);
  container.appendChild(el('button',{class:'btn btn-ghost miniadd',type:'button',
    onclick:()=>{ const a = {nom:'', photos:[]}; albums.push(a); opened.add(a); markDirty(); draw(); }},

}

function section(title, openFirst, buildBody){
  const det = el('details',{class:'section'});
  if(openFirst) det.open = true;
  det.appendChild(el('summary',{}, el('span',{},title), el('span',{class:'chev'},'›')));
  const body = el('div',{class:'section-body'});
  buildBody(body);
  det.appendChild(body);
  return det;
}
function setupTabs(){
  const sections = [...$app.querySelectorAll(':scope > .section')];
  $tabs.innerHTML = '';
  sections.forEach((sec, i)=>{
    const title = sec.querySelector(':scope > summary > span')?.textContent || ('Section '+(i+1));
    $tabs.appendChild(el('button',{type:'button',onclick:()=>setActive(i)}, title));
  });
  if(activeTab >= sections.length) activeTab = 0;
  applyMode();
}
function setActive(i){
  activeTab = i;
  const sections = [...$app.querySelectorAll(':scope > .section')];
  const btns = [...$tabs.children];
  sections.forEach((s,idx)=>s.classList.toggle('is-active', idx===i));
  btns.forEach((b,idx)=>b.classList.toggle('active', idx===i));
}
function applyMode(){
  const sections = [...$app.querySelectorAll(':scope > .section')];
  if(mqDesktop.matches){
    sections.forEach(s=>s.open = true);
    setActive(activeTab);
  } else {
    sections.forEach((s,idx)=>{ s.classList.remove('is-active'); s.open = (idx===0); });
  }
}
mqDesktop.addEventListener('change', applyMode);

    b.appendChild(textField('Introduction', p.intro, v=>p.intro=v, {multiline:true}));

    const kit = p.kit = p.kit || {};
    b.appendChild(el('div',{style:'margin-top:22px;font-weight:700;font-family:Fraunces,serif;'},'Bloc « Kit presse »'));
    b.appendChild(textField('Titre', kit.title, v=>kit.title=v));
    b.appendChild(textField('Texte', kit.text, v=>kit.text=v, {multiline:true}));
    b.appendChild(textField('Bouton', kit.cta, v=>kit.cta=v));

    p.articles = p.articles || [];
    b.appendChild(el('div',{style:'margin-top:26px;font-weight:700;font-family:Fraunces,serif;'},'Articles'));
    b.appendChild(el('div',{class:'hint',style:'margin:8px 0 14px'},
      'L’année (« Annee ») pilote les boutons de filtre sur la page — utilisez 4 chiffres (ex: 2026).'));
    const wrap = el('div');
    repeatList(wrap, p.articles, 'Article',
      (a)=>[
        el('div',{class:'grid3'},
          textField('Source', a.source, v=>a.source=v),
          textField('Date (jj/mm/aaaa)', a.date, v=>a.date=v),
          textField('Année', a.annee, v=>a.annee=v)),
        textField('Titre de l’article', a.titre, v=>a.titre=v),
        textField('Résumé', a.resume, v=>a.resume=v, {multiline:true})
      ],
      ()=>({source:'',titre:'',date:'',annee:'',resume:''}));
    b.appendChild(wrap);
  }));

  /* ══════════════ PAGE VOYAGES ══════════════ */
  $app.appendChild(section('Page « Voyages »', false, b=>{
    const p = state.voyagesPage = state.voyagesPage || {};
    b.appendChild(textField('Petit titre (haut de page)', p.eyebrow, v=>p.eyebrow=v));
    b.appendChild(textField('Titre de la page', p.title, v=>p.title=v));
    b.appendChild(textField('Introduction', p.intro, v=>p.intro=v, {multiline:true}));

    /* — encart « prochain voyage » — */
    const n = p.prochain = p.prochain || {};
    b.appendChild(el('h3',{class:'subhead'},'Encart « Prochain voyage » (haut de page)'));
    b.appendChild(selectField('Afficher cet encart', n.actif || 'oui',
      [['oui','Oui, l’afficher'],['non','Non, le masquer']], v=>n.actif=v));
    b.appendChild(el('div',{class:'grid2'},
      textField('Légende manuscrite', n.tagline, v=>n.tagline=v),
      textField('Titre', n.titre, v=>n.titre=v)));
    b.appendChild(el('div',{class:'grid2'},
      textField('Date', n.date, v=>n.date=v),
      textField('Lieu / destination', n.lieu, v=>n.lieu=v)));
    b.appendChild(textField('Texte', n.texte, v=>n.texte=v, {multiline:true}));
    b.appendChild(el('div',{class:'grid2'},
      textField('Bouton', n.cta, v=>n.cta=v, {hint:'Laissez vide pour ne pas afficher de bouton.'}),
      textField('Lien du bouton', n.href, v=>n.href=v, {placeholder:'index.php#contact'})));
    b.appendChild(photoField('Photo', n.photo, v=>n.photo=v));

    /* — liste des voyages — */
    b.appendChild(el('h3',{class:'subhead'},'Les voyages passés'));
    b.appendChild(el('div',{class:'grid2'},
      textField('Titre de la liste', p.archivesTitle, v=>p.archivesTitle=v),
      textField('Phrase d’introduction', p.archivesIntro, v=>p.archivesIntro=v)));
    p.list = p.list || [];
    b.appendChild(el('div',{class:'hint',style:'margin:12px 0'},
      p.list.length+' voyages. Le type (Journée / Week-end) sert de bouton de filtre sur la page ; l’année s’affiche sur la photo.'));
    const vWrap = el('div');
    repeatList(vWrap, p.list, 'Voyage',
      (x)=>[
        el('div',{class:'grid3'},
          textField('Année', x.annee, v=>x.annee=v, {placeholder:'2019'}),
          selectField('Type', x.type || 'Journée',
            [['Journée','Journée'],['Week-end','Week-end']], v=>x.type=v),
          textField('Date affichée', x.date, v=>x.date=v, {placeholder:'11 mai 2019'})),
        textField('Titre (destination)', x.titre, v=>x.titre=v),
        textField('Texte', x.texte, v=>x.texte=v, {multiline:true}),
        textField('Au programme', x.programme, v=>x.programme=v,
          {multiline:true, hint:'Une étape par ligne. Laissez vide pour ne rien afficher.'}),
        photoField('Photo', x.photo, v=>x.photo=v)
      ],
      ()=>({annee:'',type:'Journée',titre:'',date:'',texte:'',programme:'',photo:''}));
    b.appendChild(vWrap);

    /* — encart bas de page — */
    b.appendChild(el('h3',{class:'subhead'},'Encart bas de page'));
    const vc = p.cta = p.cta || {};
    b.appendChild(textField('Titre', vc.title, v=>vc.title=v));
    b.appendChild(textField('Texte', vc.text, v=>vc.text=v, {multiline:true}));
    b.appendChild(textField('Bouton', vc.btn, v=>vc.btn=v));
  }));

  /* ══════════════ PAGE COURS DE DÉGUSTATION ══════════════ */
  $app.appendChild(section('Page « Cours de dégustation »', false, b=>{
    const p = state.coursPage = state.coursPage || {};
    b.appendChild(textField('Petit titre (haut de page)', p.eyebrow, v=>p.eyebrow=v));
    b.appendChild(textField('Titre de la page', p.title, v=>p.title=v));
    b.appendChild(textField('Saison', p.saison, v=>p.saison=v,
      {placeholder:'Saison 2026 – 2027', hint:'Affiché en écriture manuscrite sous le titre.'}));
    b.appendChild(textField('Introduction', p.intro, v=>p.intro=v, {multiline:true}));

    /* — animateurs — */
    b.appendChild(el('h3',{class:'subhead'},'Animateurs'));
    p.animateurs = p.animateurs || [];
    const aWrap = el('div');
    repeatList(aWrap, p.animateurs, 'Animateur',
      (a)=>[ el('div',{class:'grid3'},
        textField('Initiales', a.initials, v=>a.initials=v),
        textField('Nom', a.nom, v=>a.nom=v),
        textField('Rôle', a.role, v=>a.role=v)) ],
      ()=>({initials:'',nom:'',role:''}));
    b.appendChild(aWrap);

    /* — infos pratiques — */
    b.appendChild(el('h3',{class:'subhead'},'Infos pratiques (bandeau)'));
    p.infos = p.infos || [];
    const iWrap = el('div');
    repeatList(iWrap, p.infos, 'Info',
      (i)=>[
        el('div',{class:'grid2'},
          textField('Icône (emoji)', i.icon, v=>i.icon=v, {placeholder:'💶'}),
          textField('Libellé', i.label, v=>i.label=v, {placeholder:'Tarif'})),
        textField('Valeur', i.value, v=>i.value=v,
          {multiline:true, hint:'Les retours à la ligne sont conservés.'})
      ],
      ()=>({icon:'',label:'',value:''}));
    b.appendChild(iWrap);
    b.appendChild(textField('Note sous le bandeau', p.note, v=>p.note=v,
      {multiline:true, hint:'Petit encart orange. Laissez vide pour le masquer.'}));

    /* — inscriptions — */
    b.appendChild(el('h3',{class:'subhead'},'Encart « Inscriptions »'));
    const ins = p.inscription = p.inscription || {};
    b.appendChild(textField('Titre', ins.title, v=>ins.title=v));
    b.appendChild(textField('Texte', ins.text, v=>ins.text=v, {multiline:true}));
    b.appendChild(el('div',{class:'grid3'},
      textField('Nom du contact', ins.nom, v=>ins.nom=v),
      textField('Téléphone', ins.tel, v=>ins.tel=v),
      textField('E-mail', ins.email, v=>ins.email=v)));
    b.appendChild(textField('Libellé du bouton', ins.btn, v=>ins.btn=v));

    /* — formules & séances (2 niveaux) — */
    b.appendChild(el('h3',{class:'subhead'},'Formules et séances'));
    b.appendChild(el('div',{class:'hint',style:'margin-bottom:12px'},
      'Chaque formule (Initiation, Perfectionnement…) contient sa propre liste de séances, numérotées automatiquement dans l’ordre d’affichage.'));
    p.formules = p.formules || [];
    const fWrap = el('div');
    repeatList(fWrap, p.formules, 'Formule',
      (f)=>{
        f.seances = f.seances || [];
        const sWrap = el('div',{style:'margin-top:14px;padding-left:14px;border-left:3px solid var(--line);'});
        sWrap.appendChild(el('div',{class:'lbl',style:'margin-bottom:8px'},'Séances de cette formule'));
        repeatList(sWrap, f.seances, 'Séance',
          (s)=>[
            textField('Thème', s.theme, v=>s.theme=v),
            textField('Sous-titre (facultatif)', s.sousTitre, v=>s.sousTitre=v,
              {hint:'Affiché en italique sous le thème.'}),
            el('div',{class:'grid2'},
              textField('Animée par', s.animateur, v=>s.animateur=v),
              textField('Vins dégustés', s.vins, v=>s.vins=v, {placeholder:'5 vins rouges'})),
            tagsField('Dates', s.dates, v=>s.dates=v,
              {hint:'Séparez les dates par une virgule — ex : Mardi 4 nov. 2025 (groupe 1), Mardi 9 déc. 2025 (groupe 2)'}),
            textField('Au programme', s.programme, v=>s.programme=v,
              {multiline:true, hint:'Un point par ligne. Laissez vide pour ne rien afficher.'})
          ],
          ()=>({theme:'',sousTitre:'',animateur:'',vins:'',dates:[],programme:''}));
        return [
          el('div',{class:'grid2'},
            textField('Nom de la formule', f.nom, v=>f.nom=v),
            textField('Légende manuscrite', f.tagline, v=>f.tagline=v)),
          textField('Introduction', f.intro, v=>f.intro=v, {multiline:true}),
          sWrap
        ];
      },
      ()=>({nom:'',tagline:'',intro:'',seances:[]}));
    b.appendChild(fWrap);

    /* — archives — */
    b.appendChild(el('h3',{class:'subhead'},'Saisons précédentes (PDF)'));
    const ar = p.archives = p.archives || {};
    b.appendChild(el('div',{class:'grid2'},
      textField('Titre du bloc', ar.title, v=>ar.title=v),
      textField('Phrase d’introduction', ar.intro, v=>ar.intro=v)));
    ar.items = ar.items || [];
    const arWrap = el('div',{style:'margin-top:12px'});
    repeatList(arWrap, ar.items, 'Saison',
      (it)=>[ el('div',{class:'grid2'},
        textField('Libellé', it.label, v=>it.label=v, {placeholder:'2023 / 2024'}),
        textField('Lien du PDF', it.url, v=>it.url=v, {placeholder:'https://…'})) ],
      ()=>({label:'',url:''}));
    b.appendChild(arWrap);

    /* — encart bas de page — */
    b.appendChild(el('h3',{class:'subhead'},'Encart bas de page'));
    const cc = p.cta = p.cta || {};
    b.appendChild(textField('Titre', cc.title, v=>cc.title=v));
    b.appendChild(textField('Texte', cc.text, v=>cc.text=v, {multiline:true}));
    b.appendChild(textField('Bouton', cc.btn, v=>cc.btn=v));
  }));
  setupTabs();
}

/* ═══════════════════════════════════════════════════════════
   CHARGEMENT / ENREGISTREMENT
═══════════════════════════════════════════════════════════ */
async function load(){
  try{
    const res = await fetch('content.json?_='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    state = await res.json();
    render();
    $status.className = 'status';
    $status.textContent = 'Prêt';
    $save.disabled = true;
  }catch(e){
    $status.className = 'status err';
    $status.textContent = 'Impossible de charger content.json';
    $app.appendChild(el('div',{class:'intro',style:'border-left-color:var(--danger)'},
      'Vérifiez que content.json se trouve dans le même dossier que cette page.'));
  }
}

$save.addEventListener('click', async ()=>{
  $save.disabled = true;
  $status.className = 'status';
  $status.textContent = 'Enregistrement…';
  try{
    const res = await fetch('save.php', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    const out = await res.json();
    if(!res.ok || !out.ok) throw new Error(out.error || ('HTTP '+res.status));
    dirty = false;
    $status.className = 'status ok';
    $status.textContent = '✓ Enregistré — le site est à jour';
  }catch(e){
    $status.className = 'status err';
    $status.textContent = 'Échec : '+e.message;
    $save.disabled = false;
  }
});

window.addEventListener('beforeunload', e=>{
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});

load();
</script>

</html>
