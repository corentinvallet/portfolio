<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin · B&A Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<link rel="stylesheet" href="css/admin.css"/>

</head>
<body>

<header>
  <div class="logo-dot">B&amp;A</div>
  <div>
    <h1>Administration du site</h1>
    <p>B&amp;A Construction</p>
  </div>
</header>

<main>
  <div class="intro">
    Modifiez les <strong>textes</strong> et les <strong>photos</strong> du site, puis touchez
    <strong>Enregistrer</strong> en bas. Les changements sont publiés immédiatement.
  </div>

  <div id="cloud-warn" class="warn" style="display:none">
    ⚙️ Pour gérer les photos, renseignez votre <strong>Cloud name</strong> et votre
    <strong>Upload preset</strong> dans la section « Réglages » ci-dessous.
  </div>

  <div class="workspace">
    <nav class="tabs" id="tabs"><!-- onglets PC, générés par JS --></nav>
    <div id="app"><!-- généré par JS --></div>
  </div>
</main>

<div class="savebar">
  <div class="status" id="status">Chargement…</div>
  <button class="btn btn-accent" id="saveBtn" disabled>Enregistrer</button>
</div>
<script src="js/admin.js"></script>
</body>
</html>
