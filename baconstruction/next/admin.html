<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin · B&A Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --sand:#e8dcc8;--brown:#7a5c3e;--dark-brown:#3d2b1a;
    --cream:#f5f0e8;--accent:#c4944a;--accent-dark:#a87836;
    --text:#2a1f14;--line:rgba(122,92,62,.22);--ok:#3f7d4f;--danger:#9c4a3c;
  }
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Raleway',sans-serif;color:var(--text);background:var(--cream);
    line-height:1.5;padding-bottom:96px}

  /* ── Topbar ── */
  header{position:sticky;top:0;z-index:30;background:var(--dark-brown);
    padding:14px 18px;display:flex;align-items:center;gap:12px;
    border-bottom:1px solid rgba(196,148,74,.3)}
  .logo-dot{width:34px;height:34px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-family:'Playfair Display',serif;font-weight:900;color:#fff;font-size:.8rem}
  header h1{font-family:'Playfair Display',serif;font-size:1.02rem;color:var(--sand);font-weight:700;line-height:1.1}
  header p{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

  main{max-width:680px;margin:0 auto;padding:16px}

  .intro{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);
    padding:14px 16px;margin-bottom:16px;font-size:.85rem;color:var(--brown)}
  .intro strong{color:var(--dark-brown)}

  /* ── Accordéon sections ── */
  .section{background:#fff;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
  .section > summary{list-style:none;cursor:pointer;padding:16px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:700;color:var(--dark-brown);
    -webkit-tap-highlight-color:transparent}
  .section > summary::-webkit-details-marker{display:none}
  .section > summary .chev{transition:transform .25s;color:var(--accent);font-size:1.1rem;flex-shrink:0}
  .section[open] > summary .chev{transform:rotate(90deg)}
  .section > summary:hover{background:#faf7f1}
  .section-body{padding:4px 18px 20px}

  /* ── Champs ── */
  .field{margin-bottom:16px}
  label.lbl{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--brown);font-weight:600;margin-bottom:6px}
  input[type=text],input[type=email],input[type=tel],textarea,select{
    width:100%;padding:12px 14px;border:1px solid var(--line);background:#fff;
    font-family:'Raleway',sans-serif;font-size:1rem;color:var(--text);outline:none;
    transition:border-color .2s;border-radius:0}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:84px;line-height:1.55}
  .hint{font-size:.72rem;color:var(--brown);opacity:.7;margin-top:5px}

  /* ── Image picker ── */
  .imgpick{display:flex;gap:14px;align-items:flex-start}
  .imgpick .thumb{width:96px;height:72px;flex-shrink:0;object-fit:cover;
    background:linear-gradient(135deg,var(--dark-brown),var(--brown));border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:rgba(232,220,200,.5);
    font-size:.62rem;text-align:center;padding:4px}
  .imgpick .meta{flex:1;min-width:0}
  .imgpick .path{font-size:.72rem;color:var(--brown);word-break:break-all;
    background:#faf7f1;padding:6px 8px;border:1px solid var(--line);margin-bottom:8px}

  /* ── Boutons ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;border:none;cursor:pointer;font-family:'Raleway',sans-serif;
    font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    transition:background .2s,opacity .2s;border-radius:0}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-accent:hover{background:var(--accent-dark)}
  .btn-ghost{background:transparent;color:var(--brown);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(156,74,60,.4)}
  .btn-danger:hover{background:rgba(156,74,60,.08)}
  .btn-sm{padding:8px 12px;font-size:.68rem}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  /* ── Cartes répétables (items) ── */
  .repeat{border:1px solid var(--line);background:#faf7f1;padding:14px;margin-bottom:12px;position:relative}
  .repeat .rowtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .repeat .rowtop .tag{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  .repeat .reorder{display:flex;gap:6px}
  .miniadd{margin-top:4px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* ── Galerie ── */
  .gal-item{border:1px solid var(--line);background:#faf7f1;padding:12px;margin-bottom:12px}
  .gal-item .top{display:flex;gap:12px}
  .gal-item .gthumb{width:84px;height:64px;flex-shrink:0;object-fit:cover;border:1px solid var(--line);
    background:linear-gradient(135deg,var(--dark-brown),var(--brown))}
  .gal-fields{flex:1;min-width:0}
  .gal-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

  /* ── Barre d'enregistrement ── */
  .savebar{position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(26,18,10,.96);backdrop-filter:blur(10px);
    border-top:1px solid rgba(196,148,74,.3);
    padding:12px 16px;display:flex;align-items:center;gap:12px}
  .savebar .status{flex:1;min-width:0;font-size:.74rem;color:var(--sand)}
  .savebar .status.dirty{color:var(--accent)}
  .savebar .status.ok{color:#8fd09c}
  .savebar .status.err{color:#e3a499}
  .savebar .btn-accent{flex-shrink:0}

  /* ── Toast Cloudinary manquant ── */
  .warn{background:rgba(196,148,74,.12);border:1px solid rgba(196,148,74,.4);
    padding:10px 12px;font-size:.78rem;color:var(--brown);margin-bottom:14px}

  @media(min-width:560px){
    .imgpick .thumb{width:120px;height:84px}
  }

  /* ══ Onglets latéraux (PC uniquement) ══ */
  .tabs{display:none}              /* masqués sur mobile : accordéon natif */
  @media(min-width:920px){
    main{max-width:1500px}
    .workspace{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
    .tabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;
      background:#fff;border:1px solid var(--line);padding:8px}
    .tabs button{display:block;width:100%;text-align:left;border:none;background:none;
      font-family:'Raleway',sans-serif;font-size:.86rem;font-weight:600;color:var(--brown);
      padding:11px 13px;cursor:pointer;border-left:3px solid transparent;
      transition:background .15s,color .15s,border-color .15s;line-height:1.3}
    .tabs button:hover{background:#faf7f1;color:var(--dark-brown)}
    .tabs button.active{background:#faf7f1;color:var(--dark-brown);border-left-color:var(--accent)}

    /* une seule section visible à la fois, pilotée par les onglets */
    .section{display:none;margin-bottom:0;border:none;background:transparent}
    .section.is-active{display:block}
    .section > summary{display:none}          /* le titre est dans l'onglet */
    .section-body{padding:0}

    /* on exploite la largeur : cartes répétables côte à côte */
    .section-body > div:has(> .repeat){display:grid;grid-template-columns:1fr 1fr;
      gap:16px;align-items:start}
    .section-body > div:has(> .gal-item){display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
    .repeat,.gal-item{margin-bottom:0}
    .miniadd{margin-top:16px}
  }
</style>
</head>
<body>

<header>
  <div class="logo-dot">B&amp;A</div>
  <div>
    <h1>Administration du site</h1>
    <p>B&amp;A Construction</p>
  </div>
</header>

<main>
  <div class="intro">
    Modifiez les <strong>textes</strong> et les <strong>photos</strong> du site, puis touchez
    <strong>Enregistrer</strong> en bas. Les changements sont publiés immédiatement.
  </div>

  <div id="cloud-warn" class="warn" style="display:none">
    ⚙️ Pour gérer les photos, renseignez votre <strong>Cloud name</strong> et votre
    <strong>Upload preset</strong> dans la section « Réglages » ci-dessous.
  </div>

  <div class="workspace">
    <nav class="tabs" id="tabs"><!-- onglets PC, générés par JS --></nav>
    <div id="app"><!-- généré par JS --></div>
  </div>
</main>

<div class="savebar">
  <div class="status" id="status">Chargement…</div>
  <button class="btn btn-accent" id="saveBtn" disabled>Enregistrer</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ÉTAT
═══════════════════════════════════════════════════════════ */
let state = null;
let dirty = false;
const DEFAULT_CATS = [
  ['cave-a-vin','Caves à vins'],
  ['beton-cire','Béton ciré'],
  ['beton-desactive','Béton désactivé'],
  ['piscine','Piscine'],
  ['beton-imprime','Béton imprimé'],
  ['escalier-beton','Escalier béton']
];
let CATS = DEFAULT_CATS;

const $app    = document.getElementById('app');
const $status = document.getElementById('status');
const $save   = document.getElementById('saveBtn');
const $warn   = document.getElementById('cloud-warn');
const $tabs   = document.getElementById('tabs');

/* ── Onglets PC ── */
const mqDesktop = window.matchMedia('(min-width:920px)');
let activeTab = 0;

/* ── Helpers DOM ── */
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') n.className = attrs[k];
    else if(k==='html') n.innerHTML = attrs[k];
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!=null) n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c=>n.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return n;
}
function markDirty(){
  dirty = true;
  $save.disabled = false;
  $status.className = 'status dirty';
  $status.textContent = 'Modifications non enregistrées';
}

/* ── Champ texte lié à une valeur ── */
function textField(labelTxt, value, onChange, {multiline=false, hint='', placeholder=''}={}){
  const input = multiline
    ? el('textarea',{placeholder})
    : el('input',{type:'text',placeholder});
  input.value = value ?? '';
  input.addEventListener('input', ()=>{ onChange(input.value); markDirty(); });
  const f = el('div',{class:'field'}, el('label',{class:'lbl'},labelTxt), input);
  if(hint) f.appendChild(el('div',{class:'hint'},hint));
  return f;
}

/* ── Sélecteur de catégorie ── */
function catField(value, onChange){
  const sel = el('select');
  CATS.forEach(([v,lab])=>{
    const o = el('option',{value:v}, lab);
    if(v===value) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{ onChange(sel.value); markDirty(); });
  return el('div',{class:'field'}, el('label',{class:'lbl'},'Catégorie'), sel);
}
/* ── Sélecteur de catégorie avec option "aucun lien" (cartes Services) ── */
function catFieldOptional(labelTxt, value, onChange, hint){
  const sel = el('select');
  const none = el('option',{value:''}, 'Aucun (carte non cliquable)');
  if(!value) none.selected = true;
  sel.appendChild(none);
  CATS.forEach(([v,lab])=>{
    const o = el('option',{value:v}, lab);
    if(v===value) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{ onChange(sel.value); markDirty(); });
  const f = el('div',{class:'field'}, el('label',{class:'lbl'},labelTxt), sel);
  if(hint) f.appendChild(el('div',{class:'hint'},hint));
  return f;
}

/* ═══════════════════════════════════════════════════════════
   CLOUDINARY
═══════════════════════════════════════════════════════════ */
function cloudReady(){
  const c = state.cloudinary || {};
  return c.cloudName && c.uploadPreset;
}
/* Applique l'optimisation automatique (format + qualité) à une URL Cloudinary */
function optimize(url, extra){
  if(!url || url.indexOf('/upload/')<0) return url;
  const t = 'f_auto,q_auto' + (extra ? ','+extra : '');
  return url.replace('/upload/', '/upload/'+t+'/');
}
/* Ouvre le widget Cloudinary ; cb reçoit { full, thumb } */
function pickImage(cb){
  if(!cloudReady()){
    alert('Renseignez d’abord votre Cloud name et Upload preset dans la section « Réglages ».');
    return;
  }
  if(typeof cloudinary==='undefined'){
    alert('Le widget Cloudinary n’a pas pu se charger (connexion ?).');
    return;
  }
  const widget = cloudinary.createUploadWidget({
    cloudName: state.cloudinary.cloudName,
    uploadPreset: state.cloudinary.uploadPreset,
    sources: ['local','camera','url'],
    multiple: false,
    language: 'fr',
    text: { fr: { menu:{files:'Mes fichiers',camera:'Appareil photo',url:'Lien web'} } },
    styles: { palette: { window:'#3d2b1a', sourceBg:'#f5f0e8', windowBorder:'#c4944a',
      tabIcon:'#c4944a', inactiveTabIcon:'#7a5c3e', menuIcons:'#c4944a', link:'#c4944a',
      action:'#c4944a', inProgress:'#c4944a', complete:'#3f7d4f', error:'#9c4a3c',
      textDark:'#2a1f14', textLight:'#f5f0e8' } }
  }, (err, info)=>{
    if(!err && info && info.event==='success'){
      const url = info.info.secure_url;
      cb({
        full:  optimize(url, 'w_1600,c_limit'),
        thumb: optimize(url, 'w_600,h_450,c_fill')
      });
    }
  });
  widget.open();
}

/* ── Bloc choix d'image (image unique) ── */
function imagePicker(labelTxt, value, onChange, hint){
  let thumb = value
    ? el('img',{class:'thumb',src:optimize(value,'w_240,h_180,c_fill'),alt:''})
    : el('div',{class:'thumb'},'Aucune image');
  const path = el('div',{class:'path'}, value || '— aucune —');
  const btn = el('button',{class:'btn btn-accent btn-sm',type:'button',
    onclick:()=>pickImage(({full})=>{ onChange(full); path.textContent = full;
      const ni = el('img',{class:'thumb',src:optimize(full,'w_240,h_180,c_fill')});
      thumb.replaceWith(ni); thumb=ni; markDirty(); })
  },'📷 Changer la photo');
  const meta = el('div',{class:'meta'}, path, btn);
  if(hint) meta.appendChild(el('div',{class:'hint'},hint));
  return el('div',{class:'field'},
    el('label',{class:'lbl'},labelTxt),
    el('div',{class:'imgpick'}, thumb, meta));
}

/* ═══════════════════════════════════════════════════════════
   SECTIONS
═══════════════════════════════════════════════════════════ */
function section(title, openFirst, buildBody){
  const det = el('details',{class:'section'});
  if(openFirst) det.open = true;
  det.appendChild(el('summary',{}, el('span',{},title), el('span',{class:'chev'},'›')));
  const body = el('div',{class:'section-body'});
  buildBody(body);
  det.appendChild(body);
  return det;
}

/* ── Construction des onglets (PC) à partir des sections rendues ── */
function setupTabs(){
  const sections = [...$app.querySelectorAll(':scope > .section')];
  $tabs.innerHTML = '';
  sections.forEach((sec, i)=>{
    const title = sec.querySelector(':scope > summary > span')?.textContent || ('Section '+(i+1));
    const btn = el('button',{type:'button',onclick:()=>setActive(i)}, title);
    $tabs.appendChild(btn);
  });
  if(activeTab >= sections.length) activeTab = 0;
  applyMode();
}

/* ── Activer un onglet (mode PC) ── */
function setActive(i){
  activeTab = i;
  const sections = [...$app.querySelectorAll(':scope > .section')];
  const btns = [...$tabs.children];
  sections.forEach((s,idx)=>s.classList.toggle('is-active', idx===i));
  btns.forEach((b,idx)=>b.classList.toggle('active', idx===i));
}

/* ── Adapter selon la largeur d'écran ── */
function applyMode(){
  const sections = [...$app.querySelectorAll(':scope > .section')];
  if(mqDesktop.matches){
    /* PC : tout ouvert (le détail natif est masqué), une section affichée via onglet */
    sections.forEach(s=>s.open = true);
    setActive(activeTab);
  } else {
    /* Mobile : accordéon natif, on retire le pilotage par onglet */
    sections.forEach((s,idx)=>{ s.classList.remove('is-active'); s.open = (idx===0); });
  }
}
mqDesktop.addEventListener('change', applyMode);

function render(){
  $app.innerHTML = '';
  $warn.style.display = cloudReady() ? 'none' : 'block';
  /* recalcule CATS à partir des catégories enregistrées (ou valeurs par défaut) */
  state.categories = (state.categories && state.categories.length)
    ? state.categories
    : DEFAULT_CATS.map(([value,label])=>({value,label}));
  CATS = state.categories.map(c=>[c.value, c.label]);

  /* ── RÉGLAGES ── */
  $app.appendChild(section('Réglages & Cloudinary', !cloudReady(), b=>{
    b.appendChild(el('div',{class:'hint',style:'margin-bottom:14px'},
      'Identifiants Cloudinary (compte gratuit). Le « preset » doit être de type Unsigned.'));
    state.cloudinary = state.cloudinary || {cloudName:'',uploadPreset:''};
    b.appendChild(textField('Cloud name', state.cloudinary.cloudName,
      v=>state.cloudinary.cloudName=v, {hint:'Visible dans votre tableau de bord Cloudinary.'}));
    b.appendChild(textField('Upload preset (unsigned)', state.cloudinary.uploadPreset,
      v=>state.cloudinary.uploadPreset=v));
    b.appendChild(textField('Titre de l’onglet (SEO)', state.meta?.title,
      v=>{ state.meta=state.meta||{}; state.meta.title=v; }));
    b.appendChild(imagePicker('Logo', state.logo, v=>state.logo=v));
  }));

  /* ── HERO ── */
  $app.appendChild(section('Bannière d’accueil', true, b=>{
    const h = state.hero = state.hero || {};
    b.appendChild(imagePicker('Photo de fond', h.image, v=>h.image=v,
      'Grande image plein écran en haut du site.'));
    b.appendChild(textField('Petit titre (au-dessus)', h.eyebrow, v=>h.eyebrow=v));
    b.appendChild(textField('Noms', h.names, v=>h.names=v));
    b.appendChild(textField('Phrase d’accroche', h.sub, v=>h.sub=v, {multiline:true}));
    b.appendChild(el('div',{class:'grid2'},
      textField('Bouton principal', h.ctaPrimary, v=>h.ctaPrimary=v),
      textField('Bouton secondaire', h.ctaSecondary, v=>h.ctaSecondary=v)));
  }));

  /* ── SERVICES ── */
  $app.appendChild(section('Services', false, b=>{
    const s = state.services = state.services || {};
    b.appendChild(textField('Petit titre', s.label, v=>s.label=v));
    b.appendChild(textField('Titre', s.title, v=>s.title=v, {multiline:true,
      hint:'Astuce : appuyez sur Entrée pour forcer un retour à la ligne.'}));
    b.appendChild(textField('Introduction', s.intro, v=>s.intro=v, {multiline:true}));
    s.items = s.items || [];
    const list = el('div');
    function drawItems(){
      list.innerHTML='';
      s.items.forEach((it,i)=>{
        const card = el('div',{class:'repeat'});
        card.appendChild(el('div',{class:'rowtop'},
          el('span',{class:'tag'},'Service '+(i+1)),
          el('div',{class:'reorder'},
            el('button',{class:'btn btn-ghost btn-sm',type:'button',disabled:i===0||null,
              onclick:()=>{ [s.items[i-1],s.items[i]]=[s.items[i],s.items[i-1]]; markDirty(); drawItems(); }},'↑'),
            el('button',{class:'btn btn-ghost btn-sm',type:'button',disabled:i===s.items.length-1||null,
              onclick:()=>{ [s.items[i+1],s.items[i]]=[s.items[i],s.items[i+1]]; markDirty(); drawItems(); }},'↓'),
            el('button',{class:'btn btn-danger btn-sm',type:'button',
              onclick:()=>{ if(confirm('Supprimer ce service ?')){ s.items.splice(i,1); markDirty(); drawItems(); } }},'Supprimer')
          )));
        card.appendChild(imagePicker('Icône / image', it.icon, v=>it.icon=v));
        card.appendChild(textField('Titre', it.title, v=>it.title=v));
        card.appendChild(textField('Description', it.text, v=>it.text=v, {multiline:true}));
        card.appendChild(catFieldOptional('Lien vers la galerie', it.filter, v=>it.filter=v,
          'Si choisi, la carte devient cliquable et ouvre la galerie filtrée sur cette catégorie.'));
        list.appendChild(card);
      });
    }
    drawItems();
    b.appendChild(list);
    b.appendChild(el('button',{class:'btn btn-ghost miniadd',type:'button',
      onclick:()=>{ s.items.push({icon:'',title:'Nouveau service',text:'',filter:''}); markDirty(); drawItems(); }},'+ Ajouter un service'));
  }));

  /* ── HAUT DE GAMME (bloc accueil avec les 3 cartes) ── */
  $app.appendChild(section('Haut de gamme', false, b=>{
    const hg = state.hautdegamme = state.hautdegamme || {};
    b.appendChild(textField('Petit titre', hg.label, v=>hg.label=v));
    b.appendChild(textField('Titre', hg.title, v=>hg.title=v, {multiline:true}));
    b.appendChild(textField('Introduction', hg.intro, v=>hg.intro=v, {multiline:true}));
    hg.items = hg.items || [];
    const HG_LINK_LABELS = {
      'caves-a-vin.php': 'Caves à vin',
      'escalier-beton.php': 'Escalier béton',
      'beton-imprime.php': 'Finition de qualité'
    };
    b.appendChild(el('div',{class:'hint',style:'margin-bottom:12px'},
      'Chaque carte pointe vers une page dédiée (ci-dessous). Le lien n’est pas modifiable ici.'));
    const list = el('div');
    function draw(){
      list.innerHTML='';

/* ═══════════════════════════════════════════════════════════
   CHARGEMENT / ENREGISTREMENT
═══════════════════════════════════════════════════════════ */
async function load(){
  try{
    const res = await fetch('content.json?_='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    state = await res.json();
    render();
    $status.className = 'status';
    $status.textContent = 'Prêt';
    $save.disabled = true;
  }catch(e){
    $status.className = 'status err';
    $status.textContent = 'Impossible de charger content.json';
    $app.appendChild(el('div',{class:'warn'},
      'Vérifiez que content.json se trouve dans le même dossier que cette page.'));
  }
}

$save.addEventListener('click', async ()=>{
  $save.disabled = true;
  $status.className = 'status';
  $status.textContent = 'Enregistrement…';
  try{
    const res = await fetch('save.php', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    const out = await res.json();
    if(!res.ok || !out.ok) throw new Error(out.error || ('HTTP '+res.status));
    dirty = false;
    $status.className = 'status ok';
    $status.textContent = '✓ Enregistré — le site est à jour';
  }catch(e){
    $status.className = 'status err';
    $status.textContent = 'Échec : '+e.message;
    $save.disabled = false;
  }
});

/* Avertir avant de quitter si modifications non enregistrées */
window.addEventListener('beforeunload', e=>{
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});

load();
</script>
