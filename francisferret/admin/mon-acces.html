<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Mon accès — Francis Ferret</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/admin.css" />
<style>
  body{padding:1.5rem}
  .wrap{max-width:420px;margin:2.5rem auto}
  #msg{min-height:1.2em;font-family:"Raleway";font-style:normal}
  #msg.err{color:#b23b2c}
  #msg.ok{color:#2a8a5c}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h2>Mon accès admin</h2>
    <div class="sub">Changer le mot de passe du compte <code id="userLabel">corentin</code></div>
    <div class="field"><label>Mot de passe actuel</label><input type="password" id="pwCurrent" autocomplete="current-password"></div>
    <div class="field"><label>Nouveau mot de passe</label><input type="password" id="pwNew" autocomplete="new-password"></div>
    <div class="field"><label>Confirmer le nouveau mot de passe</label><input type="password" id="pwConfirm" autocomplete="new-password"></div>
    <button class="btn block" id="pwChangeBtn">Changer le mot de passe</button>
    <p class="muted" id="msg"></p>
  </div>
</div>

<script>
// Compte concerné par cette page. Change cette valeur si tu crées un autre
// compte séparé un jour (ex: pour une autre personne de l'équipe).
const ACCOUNT_USER = "corentin";
document.getElementById("userLabel").textContent = ACCOUNT_USER;

const $ = s => document.querySelector(s);

$("#pwChangeBtn").addEventListener("click", async () => {
  const btn = $("#pwChangeBtn"), msg = $("#msg");
  const cur = $("#pwCurrent").value, n1 = $("#pwNew").value, n2 = $("#pwConfirm").value;
  msg.className = "";

  if (!cur || !n1 || !n2) { msg.textContent = "Remplissez les trois champs"; msg.className = "err"; return; }
  if (n1.length < 10) { msg.textContent = "Le nouveau mot de passe doit faire au moins 10 caractères"; msg.className = "err"; return; }
  if (n1 !== n2) { msg.textContent = "Les deux nouveaux mots de passe ne correspondent pas"; msg.className = "err"; return; }

  btn.disabled = true;
  try {
    const res = await fetch("change-password.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: ACCOUNT_USER, current: cur, new: n1 })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || d.error) throw new Error(d.error || "Échec du changement de mot de passe");
    $("#pwCurrent").value = ""; $("#pwNew").value = ""; $("#pwConfirm").value = "";
    msg.textContent = "Mot de passe changé ✓ — utilisez-le à la prochaine connexion";
    msg.className = "ok";
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "err";
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
